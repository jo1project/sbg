name: Android APK

# 手動觸發,產生一個可直接安裝到Android手機的release APK(用debug key簽章,
# 跟android/app/build.gradle.kts裡的預設一樣,不需要額外的簽章secrets)。
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.3"
          channel: "stable"

      - run: flutter pub get

      # 拆成per-ABI各自的APK(不用--split-per-abi的話單一APK會塞進所有CPU架構的
      # native庫,檔案太大),arm64-v8a涵蓋現行絕大多數Android手機。
      - env:
          SERVER_URL: ${{ secrets.SERVER_URL }}
        run: flutter build apk --release --split-per-abi --build-number=${{ github.run_number }} --dart-define=SERVER_URL=$SERVER_URL

      - uses: actions/upload-artifact@v4
        with:
          name: snake-battle-apk
          path: client/build/app/outputs/flutter-apk/*.apk
